services:
  db:
    image: postgres:16.4-alpine
    environment: { POSTGRES_USER: governed, POSTGRES_PASSWORD: governed, POSTGRES_DB: governed }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U governed"], interval: 2s, timeout: 2s, retries: 20 }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: apps/web }
    environment: { VITE_API_URL: "http://localhost:8000" }
    ports: ["5173:5173"]
    depends_on: [api]
volumes: { pgdata: {} }
